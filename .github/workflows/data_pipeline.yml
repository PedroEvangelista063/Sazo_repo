name: Data Pipeline

# ⚠️ Cron desativado (2026-08-03): o pipeline escreve no Postgres apontado por
# secrets.DATABASE_URL, que era o Aiven free — agora em read-only (disco cheio) e
# inacessível pelo runner do GH (o dev virou 100% local). Rodar manualmente via
# workflow_dispatch quando houver um destino de escrita confiável.
on:
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install deps
        run: pip install -r pipeline/requirements.txt

      - name: Ingest CONAB data
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m pipeline.ingestao_conab

      - name: Run scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m pipeline.run_scraper_historico

      - name: DB hygiene — upsert + GC
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m pipeline.db_maintenance --db-url "$DATABASE_URL"

      - name: Audit integrity
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m pipeline.audit_local_db
