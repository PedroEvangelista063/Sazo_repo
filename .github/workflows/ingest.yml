name: Pipeline CONAB — Ingestão Mensal

on:
  # ⚠️ Cron desativado (2026-08-03): ingestão escreve via secrets.DATABASE_URL
  # (Aiven free, agora read-only/disco cheio). Dev é 100% local; rodar manualmente.
  workflow_dispatch: # disparo manual via GitHub UI

jobs:
  ingest-and-process:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependências
        run: pip install -r pipeline/requirements.txt

      - name: Rodar pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONPATH: .
        run: python -m pipeline.run

      - name: Notificar falha
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Pipeline CONAB falhou — ' + new Date().toISOString().split('T')[0],
              body: 'O workflow de ingestão mensal falhou. Verifique os logs em Actions.',
              labels: ['bug', 'pipeline']
            })
