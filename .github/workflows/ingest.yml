name: Pipeline CONAB — Ingestão Mensal

on:
  schedule:
    - cron: '0 3 5 * *'   # 5º dia de cada mês, 03:00 UTC
  workflow_dispatch:        # disparo manual via GitHub UI

jobs:
  ingest-and-process:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências
        run: pip install -r pipeline/requirements.txt

      - name: Rodar pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONPATH: .
        run: python -m pipeline.run

      - name: Notificar falha
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Pipeline CONAB falhou — ' + new Date().toISOString().split('T')[0],
              body: 'O workflow de ingestão mensal falhou. Verifique os logs em Actions.',
              labels: ['bug', 'pipeline']
            })
