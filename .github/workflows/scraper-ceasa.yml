name: Scraper CEASA/CEAGESP — Coleta Semanal

on:
  schedule:
    - cron: '0 6 * * 1'   # toda segunda 06:00 UTC
  workflow_dispatch:

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: pip install -r pipeline/requirements.txt

      - name: Executar scraper CEASA
        env:
          PYTHONPATH: .
        run: python -m pipeline.run_scraper_historico --concorrencia 4

      - name: Upload artefato
        uses: actions/upload-artifact@v4
        with:
          name: scraper-parquet
          path: database/processed_data/01_raw/scraper_hortifruti_historico.parquet
          retention-days: 30

      - name: Notificar falha
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '⚠️ Scraper CEASA falhou — ' + new Date().toISOString().split('T')[0],
              body: 'O workflow de scraper semanal falhou. Verifique os logs em Actions.',
              labels: ['bug', 'pipeline', 'scraper']
            })
