# ARQUIVO DESATIVADO: Arquitetura migrada para BYOB e Drenagem Local sob demanda.
# ------------------------------------------------------------------------------
# Este workflow (cron diário 03:30 UTC) deletava ops.audit_logs e outras tabelas
# de retenção SEM exportar localmente antes — conflitava com a arquitetura
# "Drain-First" (drenar/exportar antes de excluir) e podia causar perda
# irreversível de dados de auditoria.
#
# Substituído por:
#   - Local (sob demanda): make db-backup / make db-drain (ops/backup_local_ondemand.sh,
#     ops/drain_logs.py + ops/storage.py)
#   - Nuvem (automação):   Render Cron Job "qcomprar-drain-logs" (render.yaml,
#                          schedule "0 2 * * *") — exporta → upload S3 → TRUNCATE.
#
# TODO: remover definitivamente após confirmação do cron do Render em produção.

