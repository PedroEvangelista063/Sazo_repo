name: Supabase Keep-Alive

on:
  schedule:
    - cron: "0 */12 * * *" # A cada 12 horas (00:00 e 12:00 UTC)
  workflow_dispatch: # Execução manual pelo painel do GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install driver de conexão
        run: pip install asyncpg

      - name: Ping no Supabase (keep-alive)
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: python utilities/github_supabase_ping.py
