name: Tests & Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # rodar manualmente pelo painel do GitHub

jobs:
  test-backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: quero_comprar
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências
        run: |
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio~=1.0 pytest-timeout pytest-cov

      # ⚠️ Timeout generoso: test_circuit_breaker_blocks_after_failures usa
      # backoff REAL (2s+4s por tentativa × 5 falhas ≈ 45s) — não pode
      # ter timeout curto ou o CI falha em ambiente mais lento.
      - name: Rodar testes backend + pipeline
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/quero_comprar
          PYTEST_TIMEOUT: "10"
        run: python -m pytest backend/tests pipeline/tests -q --timeout=120 --timeout-method=thread

  test-frontend:
    name: Frontend (vitest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        working-directory: frontend
        run: npm ci

      - name: Rodar testes frontend
        working-directory: frontend
        run: npx vitest run

  build-frontend:
    name: Build (PWA)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        working-directory: frontend
        run: npm ci

      - name: Typecheck + Build
        working-directory: frontend
        run: npm run build
