      - generic [ref=f3e94]:
        - text: 
        - generic [ref=f3e95]:
          - heading "PROHORT" [level=1] [ref=f3e96]
          - generic [ref=f3e98]:
            - generic [ref=f3e99]: Publicado em 03/07/2024 20h22
            - generic [ref=f3e100]: Atualizado em 03/07/2026 13h40
          - generic [ref=f3e101]:
            - generic [ref=f3e103]:
              - generic [ref=f3e104]:
                - heading "PROHORT" [level=2] [ref=f3e107]
                - generic [ref=f3e109]:
                  - paragraph [ref=f3e110]:
                    - text: O Programa Brasileiro de Modernização do Mercado Hortigranjeiro (Prohort) foi instituído pelo Governo Federal por meio da
                    - link "Portaria nº 171, de 24/03/2005" [ref=f3e111] [cursor=pointer]:
                      - /url: https://www.normasbrasil.com.br/norma/portaria-171-2005_191298.html
                    - text: ", do Ministério da Agricultura, Pecuária e Abastecimento (Mapa), e ampliado em suas funções pela"
                    - link "Portaria nº 339, de 11/04/2014" [ref=f3e112] [cursor=pointer]:
                      - /url: https://www.gov.br/conab/pt-br/atuacao/informacoes-agropecuarias/hortigranjeiros-prohort/portaria-no-339-de-11-04-2014
                    - text: ", também do Mapa.O Prohort tem por finalidade contribuir para o desenvolvimento e modernização do setor hortigranjeiro nacional, proporcionando maior interação entre os diversos agentes governamentais envolvidos e os integrantes da cadeia de produção e distribuição, além de buscar a melhoria e a ampliação das funções dos mercados atacadistas."
                  - paragraph [ref=f3e113]:
                    - text: O Programa tem, entre suas principais ferramentas, os sistemas de informações, que trazem dados da comercialização de produtos hortigranjeiros nas principais
                    - link "Centrais de Abastecimento (Ceasas)" [ref=f3e114] [cursor=pointer]:
                      - /url: https://www.conab.gov.br/info-agro/hortigranjeiros-prohort/ceasas
                    - text: do país. Essa plataforma possibilita o acompanhamento de preços, análises de mercado, consulta de séries históricas, identificação das regiões produtoras, entre outros estudos técnicos, como já vem sendo demonstrado pelo Boletim Hortigranjeiro, publicado mensalmente pela Conab.
                  - paragraph [ref=f3e115]:
                    - strong [ref=f3e116]: "Aplicativo Prohort Ceasas:"
                    - text: Baixe o app prohort para
                    - link "Android" [ref=f3e117] [cursor=pointer]:
                      - /url: https://play.google.com/store/apps/details?id=prohortapp.conab.gov.br
                    - text: Baixe o app prohort para
                    - link "iOS" [ref=f3e118] [cursor=pointer]:
                      - /url: https://apps.apple.com/br/app/prohort-ceasas/id1451333002
                  - paragraph [ref=f3e119]:
                    - link "Clique aqui" [ref=f3e120] [cursor=pointer]:
                      - /url: https://www.gov.br/conab/pt-br/acesso-a-informacao/institucional/atos-normativos/normas-da-organizacao/operacoes/30-305_norma_captacao_divulgacao_dados_comercializacao_20_9_23.pdf/view
                    - text: para acessar a Norma de Captação e Divulgação dos Dados de Comercialização das Centrais de Abastecimento - 30.305
                  - paragraph [ref=f3e121]:
                    - strong [ref=f3e122]: "Para mais informações sobre o Prohort, contate-nos:"
                    - text: (61) 3312-2232 / 6237 / 6378 / 6383 / 2275
                    - link "prohort@conab.gov.br" [ref=f3e123] [cursor=pointer]:
                      - /url: mailto:prohort@conab.gov.br
