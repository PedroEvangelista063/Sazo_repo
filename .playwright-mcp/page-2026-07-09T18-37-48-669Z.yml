        - heading "Cotações – Preços no Atacado" [level=2] [ref=f2e83]
        - generic [ref=f2e84]:
          - generic [ref=f2e85]:
            - paragraph [ref=f2e86]:
              - strong [ref=f2e88]: Preços na capital
              - text: A Seção de Economia e Desenvolvimento realiza, cotidianamente, a cotação de preços no atacado do Entreposto da Capital.
            - paragraph [ref=f2e89]: Os dados coletados junto ao mercado por um grupo de pesquisadores também servem como referência para órgãos governamentais, produtores rurais, comerciantes, associações ligadas ao setor de alimentos e universidades.
            - paragraph [ref=f2e90]: Os valores divulgados representam a média dos preços de venda no atacado da CEAGESP (transações dos permissionários da CEAGESP com supermercados, feirantes, sacolões, restaurantes, bares e outros estabelecimentos). Essa média é calculada com base nas quantidades recebidas de mercadorias e os preços fornecidos pelos comerciantes que participaram da pesquisa no período especificado.
            - paragraph [ref=f2e91]: Importante ressaltar que os valores apurados são preços de venda no atacado e não os preços pagos ao produtor, já que que estes são negociados diretamente entre as partes (produtores e permissionários da CEAGESP), pois essas negociações dependem de diversos fatores, como qualidade, classificação, quantidade e frequência de entrega, região de origem, etc. e variam conforme cada negociação.
            - paragraph [ref=f2e92]:
              - strong [ref=f2e94]: Como consultar
            - paragraph [ref=f2e95]: Para realizar uma consulta, selecione no campo abaixo uma opção de produto, em seguida escolha a data (anterior ao dia de hoje e exceto finais de semana) e clique em consultar.
