<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- PWA Requirements: o vite-plugin-pwa injeta <link rel="manifest" href="/manifest.webmanifest"> no build -->
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <meta name="theme-color" content="#006b2c" id="theme-color-meta" />
    <meta name="description" content="Sazo Brasil: descubra a melhor época para comprar hortifruti e economize na feira" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192x192.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192x192.png" />
    <meta name="msapplication-TileImage" content="/favicon.svg" />
    <script>
      (function() {
        var t = localStorage.getItem('qcomprar-theme');
        if (t === 'dark' || (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
          document.getElementById('theme-color-meta').content = '#1a2738';
        }
      })();
    </script>
    <title>Sazo Brasil — Sazonalidade de Hortifruti</title>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
