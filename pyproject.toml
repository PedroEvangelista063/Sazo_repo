name = "quero-comprar-pipeline"
version = "0.1.0"
description = "Pipeline ETL CONAB → Índice de Sazonalidade → PostgreSQL"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["utilities/teste_apication/pipeline"]
pythonpath = ["."]
addopts = "-v --cov=pipeline --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py311"
