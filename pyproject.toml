name = "quero-comprar-pipeline"
version = "0.1.0"
description = "Pipeline ETL CONAB → Índice de Sazonalidade → PostgreSQL"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["pipeline/tests", "backend/tests", "tests"]
pythonpath = ["."]
asyncio_mode = "auto"
loop_scope = "session"
timeout_method = "signal"
addopts = "-v --cov=pipeline --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py311"
