databases:
  - name: qcomprar-db
    databaseName: quero_comprar
    user: qcomprar_user
    plan: free
    region: ohio
    ipAllowList: []

services:
  - type: web
    name: qcomprar-api
    env: python
    repo: https://github.com/PedroEvangelista063/Sazo_repo
    branch: main
    plan: free
    region: ohio
    healthCheckPath: /health
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: qcomprar-db
          property: connectionString
      - key: CORS_ORIGINS
        value: '["https://qcomprar.vercel.app"]'
      - key: RATE_LIMIT_PER_MINUTE
        value: "120"
      - key: INTERNAL_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.11"
