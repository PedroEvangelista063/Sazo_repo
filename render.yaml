databases:
  - name: qcomprar-db
    databaseName: quero_comprar
    user: qcomprar_user
    plan: free
    region: ohio
    ipAllowList: []

services:
  - type: web
    name: qcomprar-api
    env: docker
    dockerfilePath: backend/Dockerfile
    repo: https://github.com/user/quero_comprar_vg
    branch: main
    plan: free
    region: ohio
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: qcomprar-db
          property: connectionString
      - key: CORS_ORIGINS
        value: '["https://qcomprar.vercel.app"]'
      - key: RATE_LIMIT_PER_MINUTE
        value: "120"
      - key: INTERNAL_API_KEY
        sync: false
